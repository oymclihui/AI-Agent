  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: postgresql://postgres:Pg%40123456@172.16.120.120:5432/litellm
  redis_url: redis://:Redis%40123456@172.16.120.119:6379/1
  allow_virtual_keys: true
