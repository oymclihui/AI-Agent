events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS — resolve upstreams at request time (avoids "host not found" on restart)
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 100M;

        # API — proxy to backend (keep SSE/streaming working)
        location /api/ {
            set $backend_upstream http://backend:8000;
            # FastAPI collection routes require trailing slash; avoid 307 that drops :3000
            rewrite ^/api/v1/(agents|employees|skills|workflows|knowledge|tools|models|orchestrator)$ /api/v1/$1/ break;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;
            # SSE: disable buffering so events reach the client immediately
            proxy_buffering off;
            client_max_body_size 100M;
        }

        location /ws/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        location /docs {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
        }

        location /openapi.json {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
        }

        location /health {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
        }

        # Hashed build assets — safe to cache forever
        location /_next/static/ {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Frontend HTML / pages — always revalidate so new deploys load fresh chunks
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}
